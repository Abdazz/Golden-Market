name: Déploiement staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le VPS (staging)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /opt/golden-market/staging
            git fetch origin staging
            git reset --hard origin/staging
            docker compose -f docker-compose.prod.yml --env-file .env.deploy build
            docker compose -f docker-compose.prod.yml --env-file .env.deploy run --rm backend npm exec medusa db:migrate
            # db:migrate:scripts exécute aussi les migration-scripts internes de
            # @medusajs/medusa (ex. shipping profile par défaut) - nécessaire
            # avant tout seed. Sûr à répéter à chaque déploiement : ce projet ne
            # garde plus aucun script de démo dans src/migration-scripts (voir
            # journal HANDOFF.md, suppression de initial-data-seed.ts).
            docker compose -f docker-compose.prod.yml --env-file .env.deploy run --rm backend npx medusa db:migrate:scripts
            # Idempotents (vérifient l'existant par nom/handle avant de créer) -
            # sûrs à rejouer à chaque déploiement, y compris le premier.
            docker compose -f docker-compose.prod.yml --env-file .env.deploy run --rm backend npm run seed:region-bf
            docker compose -f docker-compose.prod.yml --env-file .env.deploy run --rm backend sh -c 'if [ -f "$CATALOG_PATH" ]; then npm run import:catalog; else echo "CATALOG_PATH absent, import du catalogue ignoré"; fi'
            docker compose -f docker-compose.prod.yml --env-file .env.deploy run --rm backend npm run seed:categories-bf
            docker compose -f docker-compose.prod.yml --env-file .env.deploy up -d
            docker image prune -f
