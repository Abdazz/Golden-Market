name: Déploiement production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le VPS (production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /opt/golden-market/production
            git fetch origin main
            git reset --hard origin/main

            # backend et storefront ne sont jamais construits dans le même appel
            # `docker compose build` : les deux images partagent le même contexte
            # de monorepo (même package-lock.json) et une construction concurrente
            # fait s'affronter les deux `npm ci` sur le cache de couches BuildKit
            # partagé, provoquant des ETXTBSY aléatoires sur des binaires postinstall
            # (ex. esbuild) - déjà observé sur ce projet. Toujours construire en
            # séquence, jamais avec un `build` global sans argument de service.
            docker compose -f docker-compose.prod.yml --env-file .env.deploy build backend
            docker compose -f docker-compose.prod.yml --env-file .env.deploy run --rm backend npm exec medusa db:migrate
            # db:migrate:scripts exécute aussi les migration-scripts internes de
            # @medusajs/medusa (ex. shipping profile par défaut) - nécessaire
            # avant tout seed. Sûr à répéter à chaque déploiement : ce projet ne
            # garde plus aucun script de démo dans src/migration-scripts (voir
            # journal HANDOFF.md, suppression de initial-data-seed.ts).
            docker compose -f docker-compose.prod.yml --env-file .env.deploy run --rm backend npx medusa db:migrate:scripts
            # Idempotents (vérifient l'existant par nom/handle avant de créer) -
            # sûrs à rejouer à chaque déploiement, y compris le premier.
            docker compose -f docker-compose.prod.yml --env-file .env.deploy run --rm backend npm run seed:region-bf
            docker compose -f docker-compose.prod.yml --env-file .env.deploy run --rm backend sh -c 'if [ -f "$CATALOG_PATH" ]; then npm run import:catalog; else echo "CATALOG_PATH absent, import du catalogue ignoré"; fi'
            docker compose -f docker-compose.prod.yml --env-file .env.deploy run --rm backend npm run seed:categories-bf

            # Le backend doit être démarré et joignable AVANT de construire le
            # storefront : `next build` fait de vraies requêtes réseau au backend
            # via generateStaticParams (voir docs/superpowers/plans/2026-08-27-*),
            # pas seulement au runtime.
            docker compose -f docker-compose.prod.yml --env-file .env.deploy up -d backend
            set -a
            source .env.deploy
            set +a
            for i in $(seq 1 30); do
              curl -sf "http://127.0.0.1:${BACKEND_PORT}/health" > /dev/null && break
              if [ "$i" -eq 30 ]; then
                echo "Backend injoignable après 60s, abandon." >&2
                exit 1
              fi
              sleep 2
            done

            docker compose -f docker-compose.prod.yml --env-file .env.deploy build storefront
            docker compose -f docker-compose.prod.yml --env-file .env.deploy up -d
            docker image prune -f
