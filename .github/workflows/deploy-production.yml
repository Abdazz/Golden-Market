name: Déploiement production

on:
  push:
    branches: [main]
    # Un push qui ne touche QUE de la documentation ne déclenche aucun
    # déploiement (le job entier est ignoré, pas de runner démarré).
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".claude/**"
      - "LICENSE"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le VPS (production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd /opt/golden-market/production

            BEFORE="$(git rev-parse HEAD 2>/dev/null || echo '')"
            git fetch origin main
            git reset --hard origin/main
            AFTER="$(git rev-parse HEAD)"

            # Détermine quelles images reconstruire à partir des fichiers
            # réellement modifiés depuis le dernier déploiement. `paths-ignore`
            # côté GitHub couvre déjà les pushs 100 % documentation ; ce filtre
            # gère en plus les pushs mixtes et l'optimisation backend-seul /
            # storefront-seul.
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$AFTER" ]; then
              CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
            else
              CHANGED=""
            fi

            need_backend=0
            need_storefront=0
            if [ -z "$BEFORE" ] || [ -z "$CHANGED" ]; then
              # Premier déploiement, ou re-run manuel du même commit : on
              # reconstruit tout par sécurité.
              need_backend=1
              need_storefront=1
            else
              if echo "$CHANGED" | grep -qE '^(apps/backend/|package-lock\.json|package\.json|turbo\.json|docker-compose\.prod\.yml|\.env\.deploy|apps/backend/Dockerfile)'; then
                need_backend=1
              fi
              if echo "$CHANGED" | grep -qE '^(apps/storefront/|package-lock\.json|package\.json|turbo\.json|docker-compose\.prod\.yml|apps/storefront/Dockerfile)'; then
                need_storefront=1
              fi
            fi

            echo "Fichiers modifiés depuis le dernier déploiement :"
            echo "${CHANGED:-(aucun / indéterminé)}" | sed 's/^/  /'
            echo "-> reconstruction backend=$need_backend storefront=$need_storefront"

            if [ "$need_backend" -eq 0 ] && [ "$need_storefront" -eq 0 ]; then
              echo "Aucun changement applicatif - rien à déployer."
              exit 0
            fi

            set -a
            source .env.deploy
            set +a

            DC="docker compose -f docker-compose.prod.yml --env-file .env.deploy"

            wait_backend() {
              for i in $(seq 1 30); do
                curl -sf "http://127.0.0.1:${BACKEND_PORT}/health" > /dev/null && return 0
                sleep 2
              done
              echo "Backend injoignable après 60s, abandon." >&2
              return 1
            }

            if [ "$need_backend" -eq 1 ]; then
              # backend et storefront ne sont jamais construits dans le même
              # appel `docker compose build` : contexte de monorepo partagé, un
              # `npm ci` concurrent provoque des ETXTBSY sur des binaires
              # postinstall (esbuild). Toujours en séquence.
              $DC build backend
              $DC run --rm backend npm exec medusa db:migrate
              # db:migrate:scripts exécute aussi les migration-scripts internes
              # de @medusajs/medusa (ex. shipping profile par défaut).
              $DC run --rm backend npx medusa db:migrate:scripts
              # Idempotents (vérifient l'existant par nom/handle avant de créer).
              $DC run --rm backend npm run seed:region-bf
              $DC run --rm backend sh -c 'if [ -f "$CATALOG_PATH" ]; then npm run import:catalog; else echo "CATALOG_PATH absent, import du catalogue ignoré"; fi'
              $DC run --rm backend npm run seed:categories-bf
              $DC up -d backend
            fi

            if [ "$need_storefront" -eq 1 ]; then
              # `next build` fait de vraies requêtes réseau au backend via
              # generateStaticParams : il doit tourner et répondre avant.
              $DC up -d backend
              wait_backend
              $DC build storefront
            fi

            $DC up -d
            docker image prune -f
