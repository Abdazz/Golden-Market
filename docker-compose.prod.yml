# Stack de déploiement Golden Market (staging et production). Fichier unique
# partagé entre les deux environnements : le nom des conteneurs, les ports
# publiés et les variables NEXT_PUBLIC_* viennent de .env.deploy (un fichier
# distinct par environnement, jamais commité - voir .env.deploy.example).
# N'affecte pas docker-compose.yml (infra de dev local, backend/storefront
# natifs), inchangé.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ${ENV_NAME}-golden-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${ENV_NAME}-golden-market-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: ${ENV_NAME}-golden-market-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - apps/backend/.env
    environment:
      NODE_ENV: production
      # sslmode=disable : postgres (le conteneur du service ci-dessus) ne sert
      # pas de TLS - sans ce paramètre, @medusajs/utils active SSL par défaut
      # dès que l'hôte de connexion n'est pas littéralement "localhost" ou
      # "127.0.0.1" (ce qui est le cas ici : "postgres", le nom du service
      # Docker Compose, obligatoire pour la résolution DNS interne). Sans ce
      # correctif, `medusa db:migrate` reste bloqué indéfiniment (le pool de
      # connexions avale l'erreur TLS et retente en boucle silencieusement).
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      # Même domaine public que le storefront (Apache reverse-proxy /store,
      # /admin, /auth, /app dessus) : corrige les URLs d'images générées par
      # le module file-local, qui pointent sinon vers localhost:9000.
      MEDUSA_BACKEND_PUBLIC_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:9000"
    volumes:
      # Bind mount (pas un volume nommé) : Apache sur l'hôte doit pouvoir
      # servir ce même répertoire directement (voir deploy/apache/*.conf),
      # chemin prévisible dans le répertoire de déploiement de l'environnement.
      - ./static-data:/app/static
      # Fichier Excel du catalogue (CATALOG_PATH dans apps/backend/.env),
      # placé manuellement une fois par environnement, jamais commité - le
      # workflow de déploiement l'importe s'il est présent (voir import:catalog).
      - ./catalog-data:/app/catalog-data:ro

  storefront:
    container_name: ${ENV_NAME}-golden-market-storefront
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      network: host
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_MATOMO_URL: ${NEXT_PUBLIC_MATOMO_URL:-}
        NEXT_PUBLIC_MATOMO_SITE_ID: ${NEXT_PUBLIC_MATOMO_SITE_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${STOREFRONT_PORT}:8000"

  # Statistiques de visite (Matomo self-hosted) - production uniquement, voir
  # docs/superpowers/specs/2026-09-02-statistiques-visite-design.md. Gaté par
  # le profil "analytics" : n'existe tout simplement pas sur un environnement
  # (staging) dont le .env.deploy ne définit pas COMPOSE_PROFILES=analytics.
  matomo-db:
    image: mariadb:11.4
    container_name: ${ENV_NAME}-golden-market-matomo-db
    restart: unless-stopped
    profiles: ["analytics"]
    environment:
      MYSQL_DATABASE: ${MATOMO_DB_NAME}
      MYSQL_USER: ${MATOMO_DB_USER}
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
    volumes:
      - matomo_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  matomo:
    image: matomo:5-apache
    container_name: ${ENV_NAME}-golden-market-matomo
    restart: unless-stopped
    profiles: ["analytics"]
    depends_on:
      matomo-db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME}
    ports:
      - "127.0.0.1:${MATOMO_PORT}:80"
    volumes:
      - matomo_data:/var/www/html

  # Observabilité backend (GlitchTip self-hosted, compatible protocole Sentry) -
  # staging ET production, contrairement à Matomo (voir spec) : une seule
  # instance partagée, gatée par le profil "observability" pour ne tourner
  # qu'une fois (dans le stack production), le backend staging s'y connecte
  # à distance via SENTRY_DSN. Réutilise le Redis déjà présent dans ce stack
  # (base numérotée différente via REDIS_URL), pas de nouvelle instance Redis.
  glitchtip-db:
    image: postgres:16-alpine
    container_name: ${ENV_NAME}-golden-market-glitchtip-db
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      POSTGRES_DB: ${GLITCHTIP_DB_NAME}
      POSTGRES_USER: ${GLITCHTIP_DB_USER}
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
    volumes:
      - glitchtip_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GLITCHTIP_DB_USER} -d ${GLITCHTIP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: ${ENV_NAME}-golden-market-glitchtip
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      glitchtip-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${GLITCHTIP_DB_USER}:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/${GLITCHTIP_DB_NAME}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      # Base Redis 1 (pas 0, déjà utilisée par le backend Medusa sur cette
      # même instance Redis partagée) - à revérifier au moment du déploiement
      # que 0 est bien la base du backend Medusa (voir DATABASE_URL du service
      # backend plus haut dans ce fichier).
      REDIS_URL: redis://redis:6379/1
      GLITCHTIP_DOMAIN: https://monitoring.golden-market.co
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      ENABLE_OBSERVABILITY_API: "false"
    ports:
      - "127.0.0.1:${GLITCHTIP_PORT}:8000"
    volumes:
      - glitchtip_uploads:/code/uploads

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: ${ENV_NAME}-golden-market-glitchtip-worker
    restart: unless-stopped
    profiles: ["observability"]
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      glitchtip-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${GLITCHTIP_DB_USER}:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/${GLITCHTIP_DB_NAME}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      REDIS_URL: redis://redis:6379/1
      GLITCHTIP_DOMAIN: https://monitoring.golden-market.co
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}

volumes:
  postgres_data:
  redis_data:
  matomo_db_data:
  matomo_data:
  glitchtip_db_data:
  glitchtip_uploads:
