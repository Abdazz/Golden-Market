# Services d'infrastructure pour le développement de Golden Market (Medusa).
# Le backend Medusa (apps/backend) et le storefront (apps/storefront) tournent
# sur l'hôte via `npm run dev` ; seuls Postgres et Redis sont conteneurisés ici.

services:
  postgres:
    image: postgres:16-alpine
    container_name: golden_market_medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - medusa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"   # 5433 : le 5432 local est occupé par un autre Postgres hôte

  redis:
    image: redis:7-alpine
    container_name: golden_market_medusa_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - medusa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  medusa_postgres_data:
  medusa_redis_data: